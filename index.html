<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Hopper 2026 Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Sukhumvit Set', 'Taviraj', sans-serif, 'Segoe UI'; }
    table th, table td { border: 1px solid #d1d5db; padding: 6px 8px; text-align: center; font-size: 11px; }
    table th { background-color: #f3f4f6; font-weight: 600; white-space: nowrap; }
    
    .highlight-green {
      background-color: #22c55e !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
    }
    .row-uncounted { background-color: #fef2f2 !important; color: #991b1b !important; }
    .row-counted { background-color: #f0fdf4 !important; color: #166534 !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-3 sm:p-5">
  <div class="max-w-[100%] mx-auto bg-white rounded-xl shadow-lg p-5">
    
    <!-- Header & Live Update Status -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3 border-b pb-4">
      <div>
        <h1 class="text-xl font-bold text-gray-800">Sales Hopper 2026 Dashboard</h1>
        <p class="text-xs text-gray-500">ข้อมูล Real-time จาก Google Sheets (Dynamic Header Mapping)</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="statusLed" class="inline-block w-3 h-3 bg-yellow-500 rounded-full animate-pulse"></span>
        <span id="lastUpdate" class="text-xs text-gray-500">กำลังดึงข้อมูล...</span>
        <button onclick="fetchData()" class="ml-2 bg-gray-200 hover:bg-gray-300 px-3 py-1 text-xs rounded transition">Refresh</button>
      </div>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-5">
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-center justify-between">
        <div>
          <p class="text-xs text-blue-600 font-semibold">จำนวน Hopper ที่ถูกนับ (Counted)</p>
          <h2 id="kpiCounted" class="text-2xl font-bold text-blue-900">0</h2>
        </div>
        <div class="p-2 bg-blue-500 text-white rounded-full text-lg">📊</div>
      </div>
      <div class="bg-red-50 border border-red-200 rounded-lg p-3 flex items-center justify-between">
        <div>
          <p class="text-xs text-red-600 font-semibold">จำนวน Hopper ไม่ผ่านเกณฑ์ (Uncounted)</p>
          <h2 id="kpiUncounted" class="text-2xl font-bold text-red-900">0</h2>
        </div>
        <div class="p-2 bg-red-500 text-white rounded-full text-lg">⚠️</div>
      </div>
      <div class="bg-green-50 border border-green-200 rounded-lg p-3 flex items-center justify-between sm:col-span-2 md:col-span-1">
        <div>
          <p class="text-xs text-green-600 font-semibold">ยอดขาย Hopper ที่ผ่านเกณฑ์รวม (บาท)</p>
          <h2 id="kpiTotalSales" class="text-2xl font-bold text-green-900">0 ฿</h2>
        </div>
        <div class="p-2 bg-green-500 text-white rounded-full text-lg">💰</div>
      </div>
    </div>

    <!-- Controls & Filters -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-5 bg-gray-50 p-4 rounded-lg">
      
      <!-- View Toggle Buttons -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">รูปแบบการแสดงผล</label>
        <div class="inline-flex rounded-md shadow-sm w-full" role="group">
          <button id="btnSummary" onclick="setView('summary')" class="w-1/2 px-3 py-2 text-xs font-medium bg-blue-600 text-white rounded-l-lg border hover:bg-blue-700">Summary</button>
          <button id="btnDetail" onclick="setView('detail')" class="w-1/2 px-3 py-2 text-xs font-medium bg-white text-gray-700 rounded-r-lg border hover:bg-gray-100">Detail</button>
        </div>
      </div>

      <!-- Quarter Filter Buttons -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">เลือก Quarter</label>
        <div class="grid grid-cols-4 gap-1">
          <button onclick="setQuarter('Q1')" id="btnQ1" class="q-btn bg-blue-600 text-white px-2 py-2 text-xs font-bold rounded">Q1</button>
          <button onclick="setQuarter('Q2')" id="btnQ2" class="q-btn bg-white text-gray-700 border px-2 py-2 text-xs font-bold rounded">Q2</button>
          <button onclick="setQuarter('Q3')" id="btnQ3" class="q-btn bg-white text-gray-700 border px-2 py-2 text-xs font-bold rounded">Q3</button>
          <button onclick="setQuarter('Q4')" id="btnQ4" class="q-btn bg-white text-gray-700 border px-2 py-2 text-xs font-bold rounded">Q4</button>
        </div>
      </div>

      <!-- Filters: Product & Team -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Product Group</label>
          <select id="filterProduct" onchange="renderTable()" class="w-full text-xs p-2 border rounded bg-white">
            <option value="ALL">ทั้งหมด</option>
            <option value="818">818</option>
            <option value="953">953</option>
            <option value="957">957</option>
            <option value="959">959</option>
            <option value="962">962</option>
            <option value="947">947</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Team Sales</label>
          <select id="filterTeam" onchange="onTeamChange()" class="w-full text-xs p-2 border rounded bg-white">
            <option value="ALL">ทุกทีม</option>
            <option value="BKK">BKK</option>
            <option value="AY_CM_KR_UD">AY, CM, KR-UD</option>
            <option value="SK_SR">SK-SR</option>
            <option value="CH_PB">CH-PB</option>
            <option value="CB">CB</option>
            <option value="LB_RY">LB-RY</option>
          </select>
        </div>
      </div>

      <!-- Filter: Individual Salesperson -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อฝ่ายขาย (รายบุคคล)</label>
        <select id="filterSalesperson" onchange="renderTable()" class="w-full text-xs p-2 border rounded bg-white">
          <option value="ALL">ทุกคน</option>
        </select>
      </div>

    </div>

    <!-- Table Output Container -->
    <div class="overflow-x-auto">
      <div id="tableContainer" class="text-center py-8 text-gray-500">กำลังเชื่อมต่อข้อมูล...</div>
    </div>

  </div>

  <script>
    // Constants & Configuration
    const SPREADSHEET_ID = "1BllaI8KkLyiUcIHfu8cTxn4flfDC-t8mIU2LYFkGRwI";
    const GID = "600616619";

    const TEAMS = {
      "BKK": ["นารีรัตน์ ปิ่นแก้วเกียรติ์", "ประภาส พูลทรัพย์", "พิราวรรณ์ ปฐมานุรักษ์", "ผกาววรรณ อรุณศรี", "ธีระดา พงษ์ประเสริฐ"],
      "AY_CM_KR_UD": ["น้ำเพชร ผิวฝ้าย", "ยานิวันพันธุ์ ดิษฐยานุรักษ์", "เกศเพชร ประสงค์ศรี", "อรวรรณ ใจสม", "เมริษา ตันธิกุล"],
      "SK_SR": ["ศิริวรรณ ลำใย", "ธนชัย พิลึก", "ราเชน สุพัฒนนิธิ"],
      "CH_PB": ["สุพิชฌาย์ จินดามงคล", "ทัศน์สุธี จุลศร"],
      "CB": ["วัชรวิชญ์ วรัชยารังสรรค์", "ศิลาอาสน์ สุวรรณรงค์"],
      "LB_RY": ["จุฑามาศ อิ่มพิทักษ์", "ศิริลักษณ์ กลิ่นหอม", "สุวรรณา รัตนาภากูล", "ธันยพัส รักษาถิ่น", "พรรณราย สุขมหาหลวง"]
    };

    const PRODUCT_RULES = {
      "818": { minSales: 30000, minHighlight: 6, subCols: { "Nomad": ["Nomad"], "Chemical": ["Chemical"], "Sorbent": ["Sorbent"], "Safety Walk": ["Safety Walk"] } },
      "953": { minSales: 30000, minHighlight: 6, subCols: { "WYPALL X": ["WYPALL X"], "WYPALL L": ["WYPALL L"], "Special Wiper": ["SPECIAL WYPER", "Special Wiper"] } },
      "957": { minSales: 30000, minHighlight: 6, subCols: { "ถุงมือกันบาด": ["ถุงมือกันบาด", "กลุ่มถุงมือกันบาด"], "Back support": ["Back support"] } },
      "959": { minSales: 30000, minHighlight: 6, subCols: { "Goggle": ["Goggle"], "Spectacle": ["Spectacle"], "Cleaning Solution": ["Cleaning Solution"] } },
      "962": { minSales: 10000, minHighlight: 3, subCols: { "Speedglas": ["Speedglas", "Speedglas™"] } },
      "947": { minSales: 30000, minHighlight: 6, subCols: { "Wonder grip": ["Wonder grip", "Wonder grip gloves"], "Protape": ["Protape", "Protape safety helmet"] } }
    };

    // Global State & Dynamic Col Mapping
    let rawData = [];
    let colMap = {}; // ตัวแปรเก็บตำแหน่ง Index คอลัมน์ที่ค้นหาได้แบบ Dynamic
    let currentView = 'summary';
    let currentQuarter = 'Q1';

    // Data Fetching
    function fetchData() {
      const led = document.getElementById("statusLed");
      const statusText = document.getElementById("lastUpdate");
      led.className = "inline-block w-3 h-3 bg-yellow-500 rounded-full animate-pulse";
      statusText.innerText = "กำลังดึงข้อมูล...";

      const oldScript = document.getElementById("jsonpScript");
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = "jsonpScript";
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID}&tqx=responseHandler:googleDocCallback`;
      script.onerror = () => {
        document.getElementById("tableContainer").innerHTML = `<p class='text-red-500 font-bold py-4'>ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบการตั้งค่าแชร์ของ Google Sheets</p>`;
      };

      document.body.appendChild(script);
    }

    // Google Callback Handling (Dynamic Header Matching)
    window.googleDocCallback = function(json) {
      if (!json?.table?.rows || !json?.table?.cols) {
        document.getElementById("tableContainer").innerHTML = `<p class='text-red-500 font-bold py-4'>ไม่พบโครงสร้างข้อมูลในชีต</p>`;
        return;
      }

      // 1. ดึงชื่อ Header ทั้งหมดจาก Google Sheets
      const headers = json.table.cols.map(col => (col?.label || col?.id || "").trim());

      // 2. ค้นหาตำแหน่ง Index ของแต่ละคอลัมน์โดยอัตโนมัติจากชื่อ Header
      colMap = {
        timestamp: headers.findIndex(h => h.includes("ประทับเวลา")),
        salesName: headers.findIndex(h => h.includes("ชื่อฝ่ายขาย")),
        accountId: headers.findIndex(h => h.includes("Account")),
        clientName: headers.findIndex(h => h.includes("ชื่อลูกค้า")),
        quoteNo: headers.findIndex(h => h.includes("Quotation No") || h.includes("ใบเสนอราคา")),
        products: {}
      };

      Object.keys(PRODUCT_RULES).forEach(pCode => {
        colMap.products[pCode] = {
          colComm: headers.findIndex(h => h.includes(`${pCode} Commodity`)),
          colDesc: headers.findIndex(h => h.includes(`${pCode}`) && (h.includes("Item Description") || h.includes("ชื่อรุ่นสินค้า"))),
          colSales: headers.findIndex(h => h.includes(`${pCode}`) && (h.includes("ยอดขายต่อปี") || h.includes("บาท/ปี"))),
          colQty: headers.findIndex(h => h.includes(`${pCode}`) && (h.includes("ปริมาณการใช้ต่อปี") || h.includes("จำนวนชิ้น")))
        };
      });

      // 3. แปลง Rows ข้อมูล
      rawData = json.table.rows.map(row => {
        if (!row.c) return [];
        return row.c.map(cell => {
          if (!cell || (cell.v === null && cell.f === null)) return "";
          return String(cell.f || cell.v || "").trim();
        });
      });

      populateSalesDropdown();
      document.getElementById("statusLed").className = "inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse";
      document.getElementById("lastUpdate").innerText = "อัปเดตล่าสุด: " + new Date().toLocaleTimeString('th-TH');
      renderTable();
    };

    // Helper Functions
    function parseSalesValue(valStr) {
      return parseFloat((valStr || "0").replace(/,/g, '')) || 0;
    }

    function checkQuarter(dateStr, q) {
      if (!dateStr) return false;
      const parts = dateStr.split(',')[0].split('/');
      if (parts.length < 3) return false;
      
      const [day, month, year] = parts.map(n => parseInt(n));
      if (isNaN(day) || isNaN(month) || isNaN(year)) return true;

      const dateObj = new Date(year < 100 ? 2000 + year : year, month - 1, day);

      const qBounds = {
        'Q1': dateObj <= new Date(2026, 3, 1),
        'Q2': dateObj > new Date(2026, 3, 1) && dateObj <= new Date(2026, 5, 30),
        'Q3': dateObj >= new Date(2026, 6, 1) && dateObj <= new Date(2026, 8, 30),
        'Q4': dateObj >= new Date(2026, 9, 1) && dateObj <= new Date(2026, 11, 31)
      };

      return qBounds[q] ?? true;
    }

    function evalHopperStatus(salesName, accountId, pCode, comm, salesVal, trackedKeys) {
      const rule = PRODUCT_RULES[pCode];
      const normComm = comm.toLowerCase();

      if (!comm || comm === "ไม่มี" || comm === "0") return { hasData: false };

      if (normComm.includes("stunt")) {
        return { hasData: true, isCounted: false, reason: "❌ ไม่ถูกนับ (Commodity เป็น STUNT)" };
      }

      if (normComm.includes("other")) {
        return { hasData: true, isCounted: false, reason: "❌ ไม่ถูกนับ (Commodity เป็น Other)" };
      }

      if (salesVal < rule.minSales) {
        return { hasData: true, isCounted: false, reason: `❌ ไม่ถูกนับ (ยอดขาย < ${rule.minSales.toLocaleString()} บาท)` };
      }

      const uniqueKey = `${salesName}_${accountId}_${pCode}_${normComm}`;
      if (trackedKeys.has(uniqueKey)) {
        return { hasData: true, isCounted: false, reason: "❌ ไม่ถูกนับ (Account ซ้ำใน Commodity นี้)" };
      }

      trackedKeys.add(uniqueKey);
      return { hasData: true, isCounted: true, reason: "✅ ถูกนับ" };
    }

    // Dropdown Handlers
    function populateSalesDropdown() {
      const selectSales = document.getElementById("filterSalesperson");
      const selectedTeam = document.getElementById("filterTeam").value;
      const currentSelected = selectSales.value;

      const salesList = selectedTeam === 'ALL'
        ? Object.values(TEAMS).flat()
        : TEAMS[selectedTeam] || [];

      selectSales.innerHTML = `<option value="ALL">ทุกคน</option>`;
      [...new Set(salesList)].sort().forEach(name => {
        selectSales.add(new Option(name, name));
      });

      selectSales.value = salesList.includes(currentSelected) ? currentSelected : "ALL";
    }

    function onTeamChange() {
      populateSalesDropdown();
      renderTable();
    }

    // Main Render Pipeline
    function renderTable() {
      const selectedProd = document.getElementById("filterProduct").value;
      const selectedTeam = document.getElementById("filterTeam").value;
      const selectedSales = document.getElementById("filterSalesperson").value;

      const cSalesNameIdx = colMap.salesName >= 0 ? colMap.salesName : 1;
      const cTimestampIdx = colMap.timestamp >= 0 ? colMap.timestamp : 0;

      let filtered = rawData.filter(row => checkQuarter(row[cTimestampIdx], currentQuarter));

      if (selectedTeam !== 'ALL') {
        const teamMembers = TEAMS[selectedTeam] || [];
        filtered = filtered.filter(row => teamMembers.includes(row[cSalesNameIdx]));
      }

      if (selectedSales !== 'ALL') {
        filtered = filtered.filter(row => row[cSalesNameIdx] === selectedSales);
      }

      calculateKpiCards(filtered, selectedProd);

      if (currentView === 'summary') {
        renderSummaryView(filtered, selectedProd, selectedTeam, selectedSales);
      } else {
        renderDetailView(filtered, selectedProd);
      }
    }

    function calculateKpiCards(data, selectedProd) {
      let totalCounted = 0, totalUncounted = 0, totalSalesVal = 0;
      const trackedKeys = new Set();
      const cSalesNameIdx = colMap.salesName >= 0 ? colMap.salesName : 1;
      const cAccountIdIdx = colMap.accountId >= 0 ? colMap.accountId : 2;

      data.forEach(row => {
        const salesName = row[cSalesNameIdx];
        const accountId = row[cAccountIdIdx] || "";

        Object.keys(PRODUCT_RULES).forEach(pCode => {
          if (selectedProd !== 'ALL' && selectedProd !== pCode) return;

          const pMap = colMap.products[pCode];
          if (!pMap || pMap.colComm < 0) return;

          const comm = (row[pMap.colComm] || "").trim();
          const salesVal = parseSalesValue(row[pMap.colSales]);

          const status = evalHopperStatus(salesName, accountId, pCode, comm, salesVal, trackedKeys);
          if (status.hasData) {
            if (status.isCounted) {
              totalCounted++;
              totalSalesVal += salesVal;
            } else {
              totalUncounted++;
            }
          }
        });
      });

      document.getElementById("kpiCounted").innerText = totalCounted.toLocaleString();
      document.getElementById("kpiUncounted").innerText = totalUncounted.toLocaleString();
      document.getElementById("kpiTotalSales").innerText = totalSalesVal.toLocaleString() + " ฿";
    }

    function renderSummaryView(data, selectedProd, selectedTeam, selectedSales) {
      const salesList = selectedSales !== 'ALL' ? [selectedSales]
                      : selectedTeam !== 'ALL' ? TEAMS[selectedTeam] || []
                      : Object.values(TEAMS).flat();

      const pCodes = Object.keys(PRODUCT_RULES);
      let grandTotals = {};
      pCodes.forEach(p => {
        Object.keys(PRODUCT_RULES[p].subCols).forEach(sub => grandTotals[`${p}_${sub}`] = 0);
        grandTotals[`${p}_TOTAL`] = 0;
      });

      const cSalesNameIdx = colMap.salesName >= 0 ? colMap.salesName : 1;
      const cAccountIdIdx = colMap.accountId >= 0 ? colMap.accountId : 2;

      let tbodyHtml = salesList.map(salesName => {
        const salesRows = data.filter(r => r[cSalesNameIdx] === salesName);
        let subCounts = {};
        pCodes.forEach(p => {
          Object.keys(PRODUCT_RULES[p].subCols).forEach(sub => subCounts[`${p}_${sub}`] = 0);
        });

        const trackedKeys = new Set();

        salesRows.forEach(row => {
          const accountId = row[cAccountIdIdx] || "";
          pCodes.forEach(pCode => {
            const rule = PRODUCT_RULES[pCode];
            const pMap = colMap.products[pCode];
            if (!pMap || pMap.colComm < 0) return;

            const comm = (row[pMap.colComm] || "").trim();
            const salesVal = parseSalesValue(row[pMap.colSales]);
            const normComm = comm.toLowerCase();

            if (normComm.includes("stunt") || normComm.includes("other") || salesVal < rule.minSales) return;

            Object.keys(rule.subCols).forEach(subCat => {
              const isMatch = rule.subCols[subCat].some(kw => normComm.includes(kw.toLowerCase()));
              if (isMatch) {
                const uniqueKey = `${salesName}_${accountId}_${pCode}_${subCat}_${normComm}`;
                if (!trackedKeys.has(uniqueKey)) {
                  trackedKeys.add(uniqueKey);
                  subCounts[`${pCode}_${subCat}`]++;
                  grandTotals[`${pCode}_${subCat}`]++;
                }
              }
            });
          });
        });

        let rowColsHtml = pCodes.map(pCode => {
          const isHidden = selectedProd !== 'ALL' && selectedProd !== pCode ? 'hidden' : '';
          const subCats = Object.keys(PRODUCT_RULES[pCode].subCols);
          
          const categoryGroupTotal = subCats.reduce((sum, sub) => sum + subCounts[`${pCode}_${sub}`], 0);
          grandTotals[`${pCode}_TOTAL`] += categoryGroupTotal;

          const hasAll = subCats.every(sub => subCounts[`${pCode}_${sub}`] > 0);
          const isHighlighted = hasAll && categoryGroupTotal >= PRODUCT_RULES[pCode].minHighlight;
          const totalBg = isHighlighted ? 'highlight-green' : 'bg-blue-50 font-bold';

          const subCells = subCats.map(sub => `<td class="${isHidden}">${subCounts[`${pCode}_${sub}`]}</td>`).join('');
          return `${subCells}<td class="${isHidden} ${totalBg}">${categoryGroupTotal}</td>`;
        }).join('');

        return `<tr><td class="font-medium text-left px-3">${salesName}</td>${rowColsHtml}</tr>`;
      }).join('');

      let tfootColsHtml = pCodes.map(pCode => {
        const isHidden = selectedProd !== 'ALL' && selectedProd !== pCode ? 'hidden' : '';
        const subCats = Object.keys(PRODUCT_RULES[pCode].subCols);
        const subCells = subCats.map(sub => `<td class="${isHidden}">${grandTotals[`${pCode}_${sub}`]}</td>`).join('');
        return `${subCells}<td class="${isHidden} bg-blue-300 font-extrabold">${grandTotals[`${pCode}_TOTAL`]}</td>`;
      }).join('');

      let html = `<table class="min-w-full bg-white">
        <thead>
          <tr class="bg-blue-200 text-gray-800">
            <th rowspan="2" class="align-middle border">ชื่อฝ่ายขาย</th>
            <th colspan="5" class="${selectedProd==='818'||selectedProd==='ALL'?'':'hidden'} bg-blue-100">818</th>
            <th colspan="4" class="${selectedProd==='953'||selectedProd==='ALL'?'':'hidden'} bg-indigo-100">953</th>
            <th colspan="3" class="${selectedProd==='957'||selectedProd==='ALL'?'':'hidden'} bg-blue-100">957</th>
            <th colspan="4" class="${selectedProd==='959'||selectedProd==='ALL'?'':'hidden'} bg-indigo-100">959</th>
            <th colspan="2" class="${selectedProd==='962'||selectedProd==='ALL'?'':'hidden'} bg-blue-100">962</th>
            <th colspan="3" class="${selectedProd==='947'||selectedProd==='ALL'?'':'hidden'} bg-indigo-100">947</th>
          </tr>
          <tr class="bg-gray-100 text-gray-700">
            <!-- 818 -->
            <th class="${selectedProd==='818'||selectedProd==='ALL'?'':'hidden'}">Nomad</th>
            <th class="${selectedProd==='818'||selectedProd==='ALL'?'':'hidden'}">Chemical</th>

    // Detail View
    function renderDetailView(data, selectedProd) {
      let rowsHtml = "";
      const trackedKeys = new Set();

      const cTimestampIdx = colMap.timestamp >= 0 ? colMap.timestamp : 0;
      const cSalesNameIdx = colMap.salesName >= 0 ? colMap.salesName : 1;
      const cAccountIdIdx = colMap.accountId >= 0 ? colMap.accountId : 2;
      const cClientNameIdx = colMap.clientName >= 0 ? colMap.clientName : 3;
      const cQuoteNoIdx = colMap.quoteNo >= 0 ? colMap.quoteNo : 4;

      data.forEach(row => {
        const timestamp = row[cTimestampIdx] || '';
        const salesName = row[cSalesNameIdx] || '';
        const accountId = row[cAccountIdIdx] || '';
        const clientName = row[cClientNameIdx] || '';
        const quoteNo = row[cQuoteNoIdx] || '';

        Object.keys(PRODUCT_RULES).forEach(pCode => {
          if (selectedProd !== 'ALL' && selectedProd !== pCode) return;

          const pMap = colMap.products[pCode];
          if (!pMap || pMap.colComm < 0) return;

          const comm = (row[pMap.colComm] || '').trim();
          const desc = (row[pMap.colDesc] || '').trim();
          const qtyStr = row[pMap.colQty] || '-';
          const salesVal = parseSalesValue(row[pMap.colSales]);

          const status = evalHopperStatus(salesName, accountId, pCode, comm, salesVal, trackedKeys);

          if (status.hasData) {
            const rowClass = status.isCounted ? "row-counted" : "row-uncounted font-semibold";
            const combinedCommDesc = (desc && desc !== "0") ? `${comm} - ${desc}` : comm;

            rowsHtml += `<tr class="${rowClass}">
              <td>${timestamp}</td>
              <td>${salesName}</td>
              <td>${accountId}</td>
              <td class="text-left px-2">${clientName}</td>
              <td>${quoteNo}</td>
              <td class="font-bold">${pCode}</td>
              <td class="text-left px-2">${combinedCommDesc}</td>
              <td class="text-right px-2">${salesVal > 0 ? salesVal.toLocaleString() : '0'}</td>
              <td>${qtyStr}</td>
              <td class="font-bold px-2">${status.reason}</td>
            </tr>`;
          }
        });
      });

      let html = `<table class="min-w-full bg-white text-xs">
        <thead>
          <tr class="bg-gray-200 text-gray-800">
            <th>ประทับเวลา</th>
            <th>ชื่อฝ่ายขาย</th>
            <th>Account</th>
            <th>ชื่อลูกค้า</th>
            <th>Quotation No.</th>
            <th>หมวดสินค้า</th>
            <th>Commodity & Description</th>
            <th>ยอดขายต่อปี (บาท)</th>
            <th>ปริมาณใช้ต่อปี</th>
            <th>สถานะการนับ</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;

      document.getElementById("tableContainer").innerHTML = html;
    }

    // Navigation & View Toggles
    function setView(view) {
      currentView = view;
      document.getElementById("btnSummary").className = view === 'summary' 
        ? "w-1/2 px-3 py-2 text-xs font-medium bg-blue-600 text-white rounded-l-lg border hover:bg-blue-700"
        : "w-1/2 px-3 py-2 text-xs font-medium bg-white text-gray-700 rounded-l-lg border hover:bg-gray-100";
      
      document.getElementById("btnDetail").className = view === 'detail' 
        ? "w-1/2 px-3 py-2 text-xs font-medium bg-blue-600 text-white rounded-r-lg border hover:bg-blue-700"
        : "w-1/2 px-3 py-2 text-xs font-medium bg-white text-gray-700 rounded-r-lg border hover:bg-gray-100";
      
      renderTable();
    }

    function setQuarter(q) {
      currentQuarter = q;
      document.querySelectorAll('.q-btn').forEach(btn => {
        btn.className = "q-btn bg-white text-gray-700 border px-2 py-2 text-xs font-bold rounded";
      });
      document.getElementById(`btn${q}`).className = "q-btn bg-blue-600 text-white px-2 py-2 text-xs font-bold rounded";
      renderTable();
    }

    // Auto-refresh interval (every 60 seconds)
    setInterval(fetchData, 60000);
    fetchData();
  </script>
